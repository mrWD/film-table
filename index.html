<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f2f2f2" />
    <script>
      // Applies the saved theme before first paint so there is no light flash.
      try {
        var saved = JSON.parse(localStorage.getItem('filmtable-theme') || '{}')
        var choice = saved && saved.state && saved.state.theme
        var dark =
          choice === 'dark' ||
          (choice !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
        if (choice === 'dark' || choice === 'light') document.documentElement.dataset.theme = choice
        document
          .querySelector('meta[name="theme-color"]')
          .setAttribute('content', dark ? '#0e0e10' : '#f2f2f2')
      } catch (e) {
        /* first run, or storage blocked */
      }
    </script>
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="FilmTable" />
    <meta name="description" content="Track TV shows and movies. A local-first TV Time replacement." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>FilmTable</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
